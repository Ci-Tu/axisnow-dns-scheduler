# AxisNow 拨测应答器 —— nginx 配置
#
# 作用：让 AxisNow 的官方拨测模板能直接探测这台服务器，不必为每个项目单独建模板。
#
# 官方默认模板的探测方式是：
#   HEAD https://<目标IP>:443/aegis_node_ping/      Host/SNI = 目标 IP
# 自建服务器对「用 IP 当 Host」且没有 IP 证书的请求会握手失败，
# 于是只能每个项目建一个模板（Host 改成域名、path 改成 /healthz），
# 结果同一个 IP 被重复探测 N 次。
#
# 本配置在指定端口上提供一个「任何 Host 都命中」的应答端点，
# 配合一个统一模板（http + 本端口 + /aegis_node_ping/ + follow_target）即可全覆盖。
#
# 只对这一个精确路径返回 200，其它一律 404，不暴露任何信息。

server {
    listen 80 default_server;
    server_name _;

    # 探针每 30–60 秒一次，日志毫无价值且会撑爆磁盘
    access_log off;
    # 不暴露 nginx 版本
    server_tokens off;

    # 探测端点：精确匹配，任何 Host / 任何源 IP 都返回 200
    location = /aegis_node_ping/ {
        add_header Content-Type "text/plain" always;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # 顺带兼容一些探针会用 GET 而非 HEAD 且路径无尾斜杠的情况
    location = /aegis_node_ping {
        return 301 /aegis_node_ping/;
    }

    # 其余一律 404，不做任何信息泄露
    location / {
        return 404;
    }
}
