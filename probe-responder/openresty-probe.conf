# ============================================================
#  AxisNow 拨测应答端点（放在每台被探测的服务器的 OpenResty 里）
#
#  设计要点：
#  · 监听 80，按 server_name 匹配 —— 不声明 default_server，
#    所以不会和现有站点的 default_server 冲突，完全不影响业务
#  · 所有服务器用同一个测试域名，这样只需要一个统一拨测模板
#  · 只对固定几个探针路径返回 200，其它一律 404，不泄露任何信息
#  · 不记访问日志（探针每 30~60 秒一次，日志没意义还会撑爆磁盘）
# ============================================================

server {
    listen 80;

    # ▼▼▼ 改成你自己的测试域名（所有服务器保持一致） ▼▼▼
    server_name probe.example.com;

    access_log off;
    server_tokens off;

    # ---- 统一探针端点（AxisNow 官方默认路径） ----
    location = /aegis_node_ping/ {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }
    # 有些探针/手测会漏掉尾斜杠，301 补上
    location = /aegis_node_ping {
        return 301 /aegis_node_ping/;
    }

    # ---- 顺手兼容几种常见健康路径，以后换模板不用改服务器 ----
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /ping {
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 根路径给个人类可读的提示，方便肉眼确认部署成功 ----
    location = / {
        default_type text/plain;
        return 200 "axisnow probe endpoint is up\n";
    }

    # ---- 其它一律 404 ----
    location / {
        return 404;
    }
}

# ============================================================
#  可选：如果以后想把拨测换成 HTTPS（443），把上面整块复制一份，
#  改成 listen 443 ssl; 并加上 ssl_certificate / ssl_certificate_key，
#  证书要覆盖你那个测试域名（比如 *.example.com 通配符证书）。
#  HTTP 版没有证书问题，优先用它。
# ============================================================
